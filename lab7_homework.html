<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 7 Homework</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f5;
    }

    h1 { margin-top: 0; }

    /* Dropdown container */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* Button that opens the menu */
    .dropbtn {
      background: #2c6e9b;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .dropbtn:hover { background: #245a80; }

    /* Hidden menu */
    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      min-width: 220px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      z-index: 1000;
    }

    .dropdown-content a {
      display: block;
      color: #222;
      padding: 12px 16px;
      text-decoration: none;
    }

    .dropdown-content a:hover { background: #e8f1f7; }

    /* Show menu on hover or when toggled open (keyboard/touch friendly) */
    .dropdown:hover .dropdown-content,
    .dropdown.open .dropdown-content {
      display: block;
    }
  </style>
</head>
<body>

  <h1>Lab 7 Homework</h1>
  <p>Select a map from the menu below. Each link opens in a new tab.</p>

  <div class="dropdown" id="mapDropdown">
    <button class="dropbtn" type="button" aria-haspopup="true">Choose a Map &#9662;</button>

    <div class="dropdown-content">
      <a href="tile_layer.html" target="_blank" rel="noopener noreferrer">Tile Layer</a>
      <a href="on_event.html" target="_blank" rel="noopener noreferrer">Task 2</a>
      <a href="basemap_gallery.html" target="_blank" rel="noopener noreferrer">Task 3</a>
      <a href="query_task.html" target="_blank" rel="noopener noreferrer">Task 4</a>
      <a href="dynamic_layers.html" target="_blank" rel="noopener noreferrer">Task 5</a>
      <a href="Simple_mapping.html" target="_blank" rel="noopener noreferrer">Task 6</a>
    </div>
  </div>

</body>
</html>
